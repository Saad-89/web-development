<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Selectors Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="title">Welcome to CSS Practice</h1>
  <p class="intro">This paragraph has a class.</p>

  <div class="card">
    <p>This is inside card.</p>
    <p class="note">Another paragraph in card.</p>
    <span>Small span</span>
  </div>

  <div class="container">
    <p>Direct child</p>
    <div>
      <p>Nested child</p>
    </div>
  </div>

  <h2>Next Section</h2>
  <p>Sibling paragraph</p>
  <p>Another paragraph</p>

  <a href="https://google.com" target="_blank">Google</a>

  <input type="text" placeholder="Type something">
</body>
</html>
